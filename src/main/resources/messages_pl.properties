# About Us
about.eyebrow=HISTORIA NASZEJ PASJI
about.title=O Vinyl Collection
about.text=Vinyl Collection powstało z pasji do muzyki i fizycznych nośników. Jako miłośnik winyli i programista chciałem stworzyć narzędzie, które ułatwi zarządzanie kolekcją płyt i sprawi, że będzie to proste, wygodne i przyjemne. Dzięki Vinyl Collection możesz katalogować albumy, odkrywać nowe wydania muzyczne, zarządzać swoją kolekcją, tworzyć playlisty i organizować płyty w boxy przygotowane na różne wydarzenia. Celem jest zebranie wszystkiego w jednym miejscu i ułatwienie czerpania przyjemności z muzyki. Keep it old school!

