# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/vinyl_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=vinyl_user
spring.datasource.password=${MYSQL_PASSWORD}

# JPA / Hibernate
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Locale
#spring.web.locale=pl_PL
#spring.web.locale-resolver=fixed

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

discogs.key=${DISCOGS_KEY}
discogs.secret=${DISCOGS_SECRET}