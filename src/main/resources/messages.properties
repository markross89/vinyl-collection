# About Us
about.eyebrow=THE STORY BEHIND THE RECORDS
about.title=About Vinyl Collection
about.text=Vinyl Collection was created from a passion for music and physical records. As a vinyl enthusiast and programmer, I wanted to build a tool that makes managing a record collection simple, convenient and enjoyable. With Vinyl Collection, you can catalog your albums, explore music releases, manage your collection, create playlists and organize records into boxes for your events. The goal is to keep everything in one place and make enjoying your music even easier. Keep it old school!

